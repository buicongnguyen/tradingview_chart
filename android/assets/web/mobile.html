<!doctype html>
<html lang="en" data-host="mobile">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self';">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>TradeChart Lab Mobile</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="dark">
    <main id="app">
      <header id="chart-header" aria-live="polite">
        <span id="symbol">OFFLINE</span>
        <span id="timeframe">—</span>
        <span id="indicator">No indicator</span>
        <span id="source">Local data</span>
      </header>
      <div id="crosshair-details" aria-live="polite">
        Touch and drag across the chart to inspect OHLCV and calculations.
      </div>
      <div id="chart" role="img" aria-label="Interactive financial chart"></div>
      <div id="loading" role="status">Starting local chart renderer…</div>
    </main>

    <script src="vendor/lightweight-charts.standalone.production.js"></script>
    <script src="chart.js"></script>
  </body>
</html>
