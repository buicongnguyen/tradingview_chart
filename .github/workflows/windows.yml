name: Windows

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Qt's msvc2022 package requires the Visual Studio 2022 runner image.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify web assets
        shell: pwsh
        run: |
          npm ci
          npm run sync-web-deps
          npm run test:web
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned web assets are not synchronized.'
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
            --outputdir "$pwd\.qt" `
            --modules qtwebengine qtwebchannel qtpositioning

      - name: Build, test, and package
        shell: pwsh
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: .\scripts\package-windows.ps1

      - name: Upload tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TradingViewChart-0.4.0-win64
          path: |
            dist/TradingViewChart-0.4.0-win64.zip
            dist/TradingViewChart-0.4.0-win64.zip.sha256
          if-no-files-found: error
