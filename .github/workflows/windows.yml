name: Windows

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Qt's msvc2022 package requires the Visual Studio 2022 runner image.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify web assets
        shell: pwsh
        run: |
          npm ci
          npm run sync-web-deps
          npm run test:web
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned web assets are not synchronized.'
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
            --outputdir "$pwd\.qt" `
            --modules qtwebengine qtwebchannel qtpositioning

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_PREFIX_PATH=$pwd\.qt\6.8.3\msvc2022_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: ctest --test-dir build -C Release --output-on-failure
