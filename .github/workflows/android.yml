name: Android

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify web assets
        run: |
          npm ci
          npm run sync-web-deps
          npm run test:web
          git diff --exit-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Qt host and Android SDKs
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            --outputdir "$PWD/.qt"
          python -m aqt install-qt linux android 6.8.3 android_arm64_v8a \
            --outputdir "$PWD/.qt" \
            --modules qtwebview

      - name: Install supported Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build Android release APK
        run: |
          "$PWD/.qt/6.8.3/android_arm64_v8a/bin/qt-cmake" \
            -S "$PWD" \
            -B "$PWD/build-android" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DQT_HOST_PATH="$PWD/.qt/6.8.3/gcc_64" \
            -DTRADINGVIEW_CHART_BUILD_TESTS=OFF
          cmake --build "$PWD/build-android" --target apk --parallel

      - name: Verify APK manifest and contents
        run: |
          apk="$PWD/build-android/android-build/build/outputs/apk/release/android-build-release-unsigned.apk"
          test -f "$apk"
          permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")"
          echo "$permissions"
          echo "$permissions" | grep "android.permission.INTERNET"
          if echo "$permissions" | grep -E \
            "ACCESS_FINE_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE"; then
            echo "Unexpected sensitive Android permission" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" list "$apk" |
            grep "assets/web/vendor/lightweight-charts.standalone.production.js"
          cp "$apk" "$PWD/TradeChartLab-1.2.0-android-arm64-v8a-unsigned.apk"
          sha256sum "$PWD/TradeChartLab-1.2.0-android-arm64-v8a-unsigned.apk" \
            > "$PWD/TradeChartLab-1.2.0-android-arm64-v8a-unsigned.apk.sha256"

      - name: Upload verified unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeChartLab-1.2.0-android-arm64-v8a-unsigned
          path: |
            TradeChartLab-1.2.0-android-arm64-v8a-unsigned.apk
            TradeChartLab-1.2.0-android-arm64-v8a-unsigned.apk.sha256
          if-no-files-found: error
